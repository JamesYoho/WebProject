<!--
PURPOSE: The single HTML shell for the entire Single Page Application (SPA).
CONTENTS:
- <head> imports for style.css, Bootstrap (if using), and external fonts.
- A single <div id="app-root"></div> where TypeScript will dynamically inject all UI screens.
- <script type="module" src="./src/main.ts"></script> to boot up the application.
- No inline JavaScript or CSS.
-->

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blitz Pictionary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app-root" class="container py-4"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
